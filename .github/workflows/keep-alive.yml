name: Keep Render App Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 5 https://attendance-system-rc2e.onrender.com/api/health
